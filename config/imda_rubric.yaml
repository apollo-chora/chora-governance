# imda_rubric.yaml — IMDA D1-D4 rubric items (authoritative source per Phase B).
#
# Canonical labels per ADR-141 (IMDA MGF v2 + AI Verify aligned):
#   D1 → accountability
#   D2 → transparency
#   D3 → safety_and_robustness
#   D4 → fairness_and_human_oversight
#
# Each rubric item is one of two derivation modes:
#
#   derivation_mode: auto
#     Status is computed at request time by the function registered under
#     auto_query_key in internal/domain/rubric/resolver.go.
#
#   derivation_mode: static
#     Status is taken straight from static_status. Used for subjective items
#     (RACI matrix, threat-model document existence, etc.) where no event /
#     evidence row exists to derive from. A static item MAY carry an
#     `evidence_url` deep-link to the repo .md doc backing it — the resolver
#     surfaces it as the FE "View evidence ↗" link.
#
# Status values: PASS | PARTIAL | FAIL
#
# priority: P1 | P2 | P3 — remediation priority, drives the O+ dimensions
# traffic-light + the per-item badge:
#   P1 = safety / security / legal / core-accountability — a single P1 FAIL
#        turns the dimension RED.
#   P2 = documentation / process / standard checks — TWO OR MORE P2 FAILs turn
#        the dimension AMBER.
#   P3 = nice-to-have — never affects the traffic light.
#
# Documentation-related static items link existing repo docs as evidence
# (per 2026-06-02 directive: "use current applicable .md docs from gh repo and
# link the evidences to FE"). Genuinely-unimplemented items (ai_disclosure,
# environmental_impact) remain FAIL — honest posture, never fabricated.
#
# Auto-mode items dispatch into resolver.go's function registry which counts
# evidence rows in the per-dimension aggregates (accountability_evidence,
# decision_explanation, eval_runs, hitl_decision_log, etc.). Thresholds for
# the auto modes are documented inline in resolver.go.

